# Alembic configuration for the Enterprise ERP (SIWRMS) database.
#
# NOTE: the actual database connection string is deliberately NOT hardcoded
# here. migrations/env.py reads it from the DATABASE_URL environment
# variable at runtime (see get_url() in that file) and overrides whatever
# is (or isn't) set below via `config.set_main_option("sqlalchemy.url", ...)`.
# The sqlalchemy.url line below is left as Alembic's own placeholder/example
# only, purely so the file is self-documenting; it is never actually used.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; includes a date-based
# prefix so `versions/` sorts chronologically at a glance
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file
sourceless = false

# version location specification
version_locations = %(here)s/migrations/versions

# version path separator; As mentioned above, this is the character used to
# split version_locations.
version_path_separator = os

# placeholder only -- NOT actually used; migrations/env.py overrides this
# from the DATABASE_URL environment variable at runtime. Left here purely
# so a bare `alembic` invocation with no env.py customization would at
# least fail loudly on an obviously-fake host, rather than silently
# pointing at a real one.
sqlalchemy.url = postgresql+psycopg2://user:pass@localhost/erp_db_placeholder_do_not_use


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on
# newly generated revision scripts. See the documentation for further
# detail and examples.
# No post-write formatting hooks (black/ruff) are configured here --
# add them later if the project adopts one; left off deliberately to keep
# this initial setup minimal and not assume a formatter choice that isn't
# yet confirmed for this codebase.


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
