<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise ERP — Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #111827;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }
    input.error {
      border-color: #ef4444;
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }
    .error-msg.visible { display: block; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enterprise ERP</h1>
    <p class="subtitle">Enter your server address to get started</p>

    <form id="setup-form">
      <label for="backend-url">Backend Server URL</label>
      <input
        id="backend-url"
        type="url"
        placeholder="https://api.example.com"
        required
        autofocus
      />
      <p class="error-msg" id="error-msg">Please enter a valid URL (e.g. https://api.example.com)</p>
      <button type="submit" id="submit-btn">Connect</button>
    </form>

    <p class="hint">This is the address of your ERP backend server.</p>
  </div>

  <script>
    const form = document.getElementById('setup-form');
    const input = document.getElementById('backend-url');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = input.value.trim();

      // Basic URL validation
      try {
        new URL(url);
      } catch {
        input.classList.add('error');
        errorMsg.classList.add('visible');
        return;
      }

      input.classList.remove('error');
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Connecting…';

      try {
        // Save the config and reload
        await window.electronAPI.setConfig({ backendUrl: url });
        await window.electronAPI.reloadApp();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Connect';
        errorMsg.textContent = 'Failed to save configuration. Please try again.';
        errorMsg.classList.add('visible');
      }
    });
  </script>
</body>
</html>
